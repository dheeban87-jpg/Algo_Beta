<title>Algo_Beta Glass Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<style>
/* Single dark avionics world — deliberately one theme, painted explicitly */
:root{
  color-scheme:dark;
  --ground:#05080C; --panel:#0A1016; --screen:#070C11; --bezel:#101922;
  --line:#1B2833; --line2:#263846; --ink:#D3DFE8; --dim:#7389A0; --faint:#3F5262;
  --cyan:#3FD0E2; --magenta:#E36CD9; --green:#47D282; --amber:#F4B43E; --red:#FF5A55; --white:#F4F8FB;
  --mono:"B612 Mono",ui-monospace,Consolas,monospace;
  --sans:"B612","Segoe UI",system-ui,sans-serif;
}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--sans);font-size:13px;line-height:1.4;padding-inline:16px;padding-block:12px 24px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
  font:700 10.5px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.ph b{color:var(--ink);font-weight:700}

/* pills */
.pill{display:inline-block;font:700 10px var(--mono);letter-spacing:.08em;padding:2px 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;line-height:1.3}
.ok{color:var(--green)} .ta{color:var(--amber)} .ra{color:var(--red)} .info{color:var(--cyan)} .mag{color:var(--magenta)} .dim{color:var(--dim)} .faint{color:var(--faint)}
.pill.fill.ra{background:var(--red);color:#1a0505;border-color:var(--red)}
.pill.fill.ta{background:var(--amber);color:#1c1204;border-color:var(--amber)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;background:var(--bezel);border:1px solid var(--line2);border-radius:3px}
.cell{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 14px;border-right:1px solid var(--line);min-width:0}
.cell:last-child{border-right:0}
.cell .k{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.cell .v{font:700 15px var(--mono);color:var(--ink);white-space:nowrap}
.cell .s{font:400 11px var(--mono);color:var(--dim);white-space:nowrap}
.brand .v{font-family:var(--sans);letter-spacing:.06em}
.brand .v span{color:var(--cyan)}
.clock .v{font-size:20px;color:var(--white)}
.grow{flex:1}
.pnlbar{height:4px;background:var(--line2);border-radius:2px;position:relative;overflow:hidden;width:140px;margin-top:3px}
.pnlbar i{position:absolute;top:0;bottom:0;border-radius:2px}
.masters{flex-direction:row;align-items:center;gap:8px}
.master{border:1px solid var(--line2);background:var(--screen);padding:6px 10px;border-radius:2px;cursor:pointer;font:700 10.5px var(--mono);letter-spacing:.1em;color:var(--faint);text-align:center;line-height:1.2}
.master.lit.w{color:#1a0505;background:var(--red);border-color:var(--red)}
.master.lit.c{color:#1c1204;background:var(--amber);border-color:var(--amber)}
.master.lit{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{filter:brightness(.55)}}
.demo{color:var(--amber)}

/* main grid */
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:12px;align-items:start}
.bottom{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;align-items:start}

/* systems */
.sys{list-style:none;margin:0;padding:6px 0}
.sys li{display:grid;grid-template-columns:12px 44px 1fr auto;gap:8px;align-items:center;padding:6px 12px}
.sys li + li{border-top:1px solid var(--line)}
.lamp{width:10px;height:10px;border-radius:2px;background:var(--faint)}
.lamp.on{background:var(--green);box-shadow:0 0 6px rgba(71,210,130,.6)}
.lamp.arm{background:var(--cyan);box-shadow:0 0 6px rgba(63,208,226,.5)}
.lamp.hold{background:var(--amber);box-shadow:0 0 6px rgba(244,180,62,.45)}
.lamp.idle{background:var(--line2)}
.sys .id{font:700 12px var(--mono);color:var(--ink)}
.sys .nm{font-size:12px;color:var(--ink);min-width:0}
.sys .nm small{display:block;color:var(--dim);font-size:10.5px;line-height:1.35}
.pipe{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.stage{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px;background:var(--screen);border:1px solid var(--line);border-radius:2px}
.stage span{color:var(--dim);font-size:11.5px}
.stage b{font:700 14px var(--mono)}
.arrow{align-self:center;color:var(--faint);font:10px var(--mono);line-height:1}

/* flight / PFD */
.fh{padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.fh-id{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fh-id .sym{font:700 22px var(--sans);letter-spacing:.04em;color:var(--white);margin-right:4px}
.fh-note{color:var(--dim);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);margin:0}
.stats div{background:var(--screen);padding:6px 8px;min-width:0;flex:1 1 104px}
.stats dt{font:700 9.5px var(--mono);letter-spacing:.12em;color:var(--dim)}
.stats dd{margin:2px 0 0;font:700 13.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfdwrap{padding:10px 14px 4px}
.pfdwrap svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 14px 10px;font:400 10.5px var(--mono);color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:1px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.g{background:var(--panel);padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;min-width:0}
.g .gl{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);align-self:flex-start}
.g svg{width:100%;max-width:190px;height:auto;display:block}
.g .gs{font:400 10.5px var(--mono);color:var(--dim);text-align:center}

/* messages */
.msgs{list-style:none;margin:0;padding:0;max-height:640px;overflow-y:auto}
.msgs li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.msgs li.acked{opacity:.5}
.msgs .t{font:400 11px var(--mono);color:var(--dim);grid-row:span 2;padding-top:2px}
.msgs .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.msgs .src{font:700 10.5px var(--mono);color:var(--dim)}
.msgs .x{font-size:12px;color:var(--ink);grid-column:2}
.ack{margin-left:auto;border:1px solid var(--line2);background:var(--screen);padding:2px 8px;border-radius:2px;cursor:pointer;font:700 10px var(--mono);letter-spacing:.08em;color:var(--ink)}
.ack:hover{border-color:var(--cyan);color:var(--cyan)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font:700 9.5px var(--mono);letter-spacing:.12em;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
#posBody tr{cursor:pointer}
#posBody tr:hover td{background:#0E161E}
#posBody tr.sel td{background:#0F1C26}
#posBody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.symc{font:700 12.5px var(--sans);color:var(--white)}
.empty{padding:16px 12px;color:var(--dim)}

.status{display:flex;flex-wrap:wrap;gap:6px 22px;padding:8px 12px;background:var(--bezel);border:1px solid var(--line);border-radius:3px;font:400 10.5px var(--mono);color:var(--dim)}
.status b{color:var(--ink);font-weight:700}

@media (max-width:1240px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .center{grid-column:1/-1;order:-1}
}
@media (max-width:900px){ .bottom{grid-template-columns:minmax(0,1fr)} }
@media (max-width:720px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell{border-right:0;border-bottom:1px solid var(--line);flex:1 1 45%}
  .fh-id .sym{font-size:19px}
}
@media (prefers-reduced-motion:reduce){ .master.lit{animation:none} }
</style>

<div class="app">
  <header class="top" id="top" aria-label="System status"></header>

  <div class="grid">
    <aside class="panel" aria-label="Phase systems">
      <div class="ph">Systems <span>phase status</span></div>
      <ul class="sys" id="sys"></ul>
      <div class="ph">Entry pipeline <span>today</span></div>
      <div class="pipe" id="pipe"></div>
    </aside>

    <main class="panel center" aria-label="Selected position">
      <div class="fh" id="fh"></div>
      <div class="pfdwrap"><svg id="pfd" viewBox="0 0 860 400" role="img" aria-label="Price trace with stop, TCAS zones, entry, ILS markers and target"></svg></div>
      <div class="legend" id="legend"></div>
      <div class="gauges" id="gauges"></div>
    </main>

    <aside class="panel" aria-label="Advisories">
      <div class="ph">ACARS · advisories <span id="msgCount"></span></div>
      <ol class="msgs" id="msgs"></ol>
    </aside>
  </div>

  <div class="bottom">
    <section class="panel">
      <div class="ph">Flights · open positions <span>click a row to load the PFD</span></div>
      <div class="tw"><table>
        <thead><tr><th>Symbol</th><th>Src</th><th>Side</th><th>Product</th><th class="r">Qty</th><th class="r">Entry</th><th class="r">LTP</th><th class="r">P&amp;L ₹</th><th class="r">P&amp;L %</th><th class="r">Stop</th><th class="r">To stop</th><th>State</th><th>Opened</th></tr></thead>
        <tbody id="posBody"></tbody>
      </table></div>
    </section>
    <section class="panel">
      <div class="ph">Logbook · closed today <span id="logSum"></span></div>
      <div class="tw"><table>
        <thead><tr><th>Time</th><th>Symbol</th><th>Src</th><th class="r">Qty</th><th class="r">Entry</th><th class="r">Exit</th><th class="r">P&amp;L ₹</th><th>Reason</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table></div>
    </section>
  </div>

  <footer class="status" id="status"></footer>
</div>

<script>
(function(){
const C={red:'#FF5A55',amber:'#F4B43E',green:'#47D282',cyan:'#3FD0E2',magenta:'#E36CD9',white:'#F4F8FB',ink:'#D3DFE8',dim:'#7389A0',faint:'#3F5262',line:'#1B2833',line2:'#263846',screen:'#070C11'};
const TCAS={TA:2.0,RA:1.5,ALIM:0.75}, T1_PROX=0.5, T1_WATCH=0.75;
const ILS=[['OM',25],['MM',50],['IM',75],['DH',90]];
const LOSS_LIMIT=-3000, MAX_POS=5;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=2)=>(n<0?'−':'+')+fmt(Math.abs(n),d);
const rup=(n,d=2)=>(n<0?'−₹':'+₹')+fmt(Math.abs(n),d);
const cls=n=>n>=0?'ok':'ra';
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const R=rng(20260923);
function gauss(r=R){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const m=x/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
const T0=11*3600+42*60+10; let sec=T0;
const clock=s=>[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':');

/* ---------- example state (not live data) ---------- */
const positions=[
 {sym:'JSWSTEEL',src:'PH5A',side:'LONG',prod:'MIS',tier:1,qty:4,entry:1215.50,stop:1194.60,target:1246.00,atr:41.90,px:1228.30,vel:0.9,opened:'10:02',hardExit:'15:10',note:'PVAT sniper · PDH breakout 1,214.80 · trend aligned (price 0.6% over 15-min MA20) · daily ATR stop'},
 {sym:'ADANIGREEN',src:'PH5',side:'SHORT',prod:'MIS',tier:1,qty:15,entry:1115.20,stop:1131.90,target:1082.00,atr:33.40,px:1110.40,vel:-0.4,opened:'09:17',hardExit:'15:10',note:'Gap-down continuation · gap −1.8% · VIX tier 2 → 0.75× size, 1.3× stop'},
 {sym:'HINDALCO',src:'PH3',side:'LONG',prod:'CNC',tier:2,qty:30,entry:684.20,stop:652.00,target:731.00,atr:15.10,px:681.10,vel:-0.25,opened:'19 Sep',note:'PH1 swing pick (score 71) · PH2 pullback entry · Tue-expiry cycle'},
 {sym:'AUBANK',src:'PH3',side:'LONG',prod:'CNC',tier:2,qty:20,entry:712.40,stop:668.00,target:760.00,atr:18.20,px:731.80,vel:0.3,opened:'18 Sep',note:'PH1 swing pick (score 78) · weekly anchor pass · ILS approach to prior high'},
];
const closed=[
 {t:'10:31',sym:'DRREDDY',src:'PH5A',side:'LONG',qty:3,entry:1223.30,exit:1231.80,reason:'TARGET_HIT'},
 {t:'09:48',sym:'TATAMOTORS',src:'PH5',side:'LONG',qty:12,entry:688.40,exit:686.95,reason:'TIER1_STOP_HIT'},
];
let msgId=0;
const msgs=[
 ['11:40:52','TA','PH4','HINDALCO · TCAS TA — 1.93 ATR to stop, Kalman velocity −0.25 ₹/min'],
 ['11:18:05','INFO','PH4','JSWSTEEL · TCAS trailing armed at +1.0% · stop trails 0.5 ATR'],
 ['10:31:40','INFO','PH4','DRREDDY · landed at target 1,231.80 · +₹25.50'],
 ['10:02:42','INFO','PH5A','JSWSTEEL · entry LONG 4 @ 1,215.50 · safety rails passed · SL-M 1,194.60'],
 ['10:00:00','INFO','PH5','Gap window closed · 2 entries taken'],
 ['09:48:12','INFO','PH4','TATAMOTORS · TIER1 stop hit 686.95 · −₹17.40'],
 ['09:17:05','INFO','PH5','ADANIGREEN · gap entry SHORT 15 @ 1,115.20'],
 ['09:05:31','INFO','PH9','Morning briefing · regime NORMAL · max positions 5 · bias BULLISH'],
 ['08:52:10','INFO','PH1','Swing scan complete · 8 selected of 187 scanned'],
].map(([t,sev,src,text])=>({id:++msgId,t,sev,src,text,acked:sev==='INFO'}));

const systems=[
 ['PH1','Stock selection','on','DONE','8 swing picks · scan 08:52'],
 ['PH2','Entry monitor','on','ON','6 monitors · 5-min cycle'],
 ['PH3','Cash execution','arm','ARMED','CNC entries after rails'],
 ['PH4','Portfolio · TCAS/ILS','on','ON','TIER1 fast loop · TIER2 TCAS'],
 ['PH5','Gap engine','idle','IDLE','Window 09:15–10:00 closed'],
 ['PH5A','PVAT sniper','on','ON','23 levels tracked · 2 armed'],
 ['PH6','Options advisor','arm','ADVISE','Advisory only · bias CALL'],
 ['PH8','Weekly momentum','hold','HOLD','Threshold 3.0 · no action'],
 ['PH9','Fund manager','arm','RAILS','Safety rails only · no entry gate'],
 ['MIE','Market intel','idle','OFF','ENABLE_MIE = False'],
];

let nifty=25312.40, niftyOpen=25207.55, niftyHist=[nifty], vix=16.80;
let selected='JSWSTEEL';

positions.forEach(p=>{
  p.dir=p.side==='LONG'?1:-1; p.anchor=p.px;
  const r=rng(hash(p.sym)); const N=150; const w=[0];
  for(let i=1;i<N;i++) w.push(w[i-1]+gauss(r));
  const s=p.atr*0.03;
  p.series=w.map((x,i)=>p.entry+(p.px-p.entry)*(i/(N-1))+(x-w[N-1]*i/(N-1))*s);
  p.lastK=state(p).k;
});

/* ---------- state logic (mirrors PH4 thresholds) ---------- */
function metrics(p){
  const d=p.dir, dist=(p.px-p.stop)*d/p.atr;
  const pnl=(p.px-p.entry)*d*p.qty, pct=(p.px-p.entry)*d/p.entry*100;
  const ils=(p.px-p.entry)/(p.target-p.entry)*100;
  return {dist,pnl,pct,ils,fav:p.vel*d};
}
function state(p){
  const m=metrics(p), adverse=p.vel*p.dir<0;
  if(p.tier===1){
    if(m.dist<=T1_PROX&&adverse) return {k:'EXIT',label:'TIER1 PROXIMITY',c:'ra'};
    if(m.dist<T1_WATCH) return {k:'WATCH',label:'WATCH',c:'ta'};
    return {k:'CLEAR',label:m.pct>=1?'TRAIL ARMED':'CLEAR',c:'ok'};
  }
  if(m.dist<TCAS.ALIM) return {k:'ALIM',label:'TCAS ALIM',c:'ra'};
  if(m.dist<TCAS.RA) return {k:'RA',label:'TCAS RA',c:'ra'};
  if(m.dist<TCAS.TA) return {k:'TA',label:'TCAS TA',c:'ta'};
  return {k:'CLEAR',label:'CLEAR',c:'ok'};
}
function phaseLabel(p){
  if(p.tier===1) return 'TIER 1 · FAST LOOP';
  const v=metrics(p).ils;
  if(v<0) return 'BELOW ENTRY';
  if(v>=90) return 'DECISION HEIGHT';
  if(v>=75) return 'INNER MARKER';
  if(v>=50) return 'MIDDLE MARKER';
  if(v>=25) return 'OUTER MARKER';
  return 'CLIMB';
}
function push(sev,src,text){msgs.unshift({id:++msgId,t:clock(sec),sev,src,text,acked:sev==='INFO'}); if(msgs.length>60) msgs.pop();}

/* ---------- simulation tick ---------- */
function step(){
  sec++;
  nifty=Math.round((nifty+gauss()*1.4+0.05)*20)/20; niftyHist.push(nifty); if(niftyHist.length>30) niftyHist.shift();
  vix=Math.max(12,Math.round((vix+gauss()*0.015)*100)/100);
  for(const p of [...positions]){
    p.vel+=(p.anchor-p.px)*0.02/p.atr*20+gauss()*0.06; p.vel*=0.96; p.vel=Math.max(-2.5,Math.min(2.5,p.vel));
    p.px=Math.round((p.px+p.vel/6+gauss()*p.atr*0.004)*20)/20;
    p.series.push(p.px); if(p.series.length>150) p.series.shift();
    const s=state(p), m=metrics(p);
    const hitTgt=(p.px-p.target)*p.dir>=0, hitStop=(p.px-p.stop)*p.dir<=0;
    if(s.k==='EXIT'||s.k==='ALIM'||hitTgt||hitStop){
      const reason=hitTgt?'TARGET_HIT':hitStop?(p.tier===1?'TIER1_STOP_HIT':'STOP_LOSS'):(p.tier===1?'TIER1_ATR_PROXIMITY':'TCAS_ALIM');
      closed.unshift({t:clock(sec).slice(0,5),sym:p.sym,src:p.src,side:p.side,qty:p.qty,entry:p.entry,exit:p.px,reason});
      push(hitTgt?'INFO':'RA','PH4',`${p.sym} · exit ${reason} @ ${fmt(p.px)} · ${rup(m.pnl)}`);
      positions.splice(positions.indexOf(p),1);
      if(selected===p.sym) selected=positions[0]?positions[0].sym:null;
      continue;
    }
    if(s.k!==p.lastK){
      const worse={CLEAR:0,WATCH:1,TA:1,RA:2}[s.k]>({CLEAR:0,WATCH:1,TA:1,RA:2}[p.lastK]??0);
      if(s.k==='CLEAR') push('INFO','PH4',`${p.sym} · clear of conflict · ${fmt(m.dist)} ATR to stop`);
      else if(worse) push(s.k==='RA'?'RA':'TA','PH4',`${p.sym} · ${s.label} — ${fmt(m.dist)} ATR to stop, velocity ${sgn(p.vel)} ₹/min`+(s.k==='RA'?' · exit advisor consulted':''));
      p.lastK=s.k;
    }
  }
  render();
}

/* ---------- renderers ---------- */
function dayPnl(){
  const real=closed.reduce((a,c)=>a+(c.exit-c.entry)*(c.side==='LONG'?1:-1)*c.qty,0);
  const open=positions.reduce((a,p)=>a+metrics(p).pnl,0);
  return {real,open,total:real+open};
}
function renderTop(){
  const chg=nifty-niftyOpen, chgP=chg/niftyOpen*100, rising=niftyHist[niftyHist.length-1]>=niftyHist[0];
  const left=15*3600+30*60-sec, dp=dayPnl();
  const warn=msgs.some(m=>!m.acked&&m.sev==='RA'), caut=msgs.some(m=>!m.acked&&m.sev==='TA');
  const lossUsed=Math.min(1,Math.max(0,-dp.total/-LOSS_LIMIT));
  const gainW=Math.min(1,Math.max(0,dp.total/3000));
  const tier=vix<15?['1','1.00×','1.0×']:vix<20?['2','0.75×','1.3×']:vix<25?['3','0.50×','1.5×']:vix<30?['4','0.25×','2.0×']:['5','SKIP','—'];
  $('top').innerHTML=`
   <div class="cell brand"><span class="k">Algo_Beta</span><span class="v">GLASS <span>COCKPIT</span></span></div>
   <div class="cell clock"><span class="k">IST · Wed 23 Sep 2026</span><span class="v num">${clock(sec)}</span></div>
   <div class="cell"><span class="k">Market</span><span class="v ok">OPEN</span><span class="s">${Math.floor(left/3600)}h ${String(Math.floor(left/60)%60).padStart(2,'0')}m to close</span></div>
   <div class="cell"><span class="k">Nifty 50 ${rising?'▲':'▼'} ${rising?'rising':'falling'}</span><span class="v num">${fmt(nifty)}</span><span class="s ${cls(chg)}">${sgn(chg)} (${sgn(chgP)}%)</span></div>
   <div class="cell"><span class="k">India VIX · tier ${tier[0]}</span><span class="v num">${fmt(vix)}</span><span class="s">size ${tier[1]} · stop ${tier[2]}</span></div>
   <div class="cell"><span class="k">Regime · PH9</span><span class="v info">NORMAL</span><span class="s">${positions.length}/${MAX_POS} positions</span></div>
   <div class="cell"><span class="k">Day P&amp;L</span><span class="v num ${cls(dp.total)}">${rup(dp.total)}</span>
     <span class="s">real ${rup(dp.real,0)} · open ${rup(dp.open,0)}</span>
     <div class="pnlbar" title="Loss used vs limit ${rup(LOSS_LIMIT,0)}"><i style="left:50%;width:${gainW*50}%;background:${C.green}"></i><i style="right:50%;width:${lossUsed*50}%;background:${C.red}"></i></div></div>
   <div class="cell grow"><span class="k">Kite session</span><span class="v ok">TOKEN VALID</span><span class="s">expires 06:00 · feed <span class="demo">DEMO</span></span></div>
   <div class="cell masters">
     <button class="master ${warn?'lit w':''}" data-master="RA" aria-label="Master warning — acknowledge all RA advisories">MASTER<br>WARN</button>
     <button class="master ${caut?'lit c':''}" data-master="TA" aria-label="Master caution — acknowledge all TA advisories">MASTER<br>CAUT</button>
   </div>`;
}
function renderSystems(){
  $('sys').innerHTML=systems.map(([id,nm,lamp,st,sub])=>`<li><span class="lamp ${lamp}" aria-hidden="true"></span><span class="id">${id}</span><span class="nm">${nm}<small>${sub}</small></span><span class="pill ${lamp==='on'?'ok':lamp==='arm'?'info':lamp==='hold'?'ta':'faint'}">${st}</span></li>`).join('');
}
function renderPipe(){
  const st=[['PH1 selected','8'],['PH2 monitoring','6'],['Entry signals','7'],['Safety rails passed','6'],['Orders filled','4'],['Open now',String(positions.length)],['Closed today',String(closed.length)]];
  $('pipe').innerHTML=st.map((s,i)=>`<div class="stage"><span>${s[0]}</span><b>${s[1]}</b></div>${i<st.length-1?'<div class="arrow" aria-hidden="true">▼</div>':''}`).join('');
}
function renderHead(p){
  if(!p){$('fh').innerHTML='<div class="empty">No open positions. The PFD loads when PH3, PH5 or PH5A fills an entry.</div>';return}
  const m=metrics(p), s=state(p);
  $('fh').innerHTML=`
   <div class="fh-id"><span class="sym">${p.sym}</span><span class="pill info">${p.src}</span><span class="pill ${p.dir>0?'ok':'ra'}">${p.side}</span><span class="pill dim">${p.prod} · TIER ${p.tier}</span><span class="pill fill ${s.c==='ok'?'':s.c}" style="${s.c==='ok'?'color:'+C.green:''}">${s.label}</span><span class="pill mag">${phaseLabel(p)}</span></div>
   <div class="fh-note">${p.note}</div>
   <dl class="stats">
     <div><dt>ENTRY</dt><dd>${fmt(p.entry)}</dd></div>
     <div><dt>LTP</dt><dd style="color:${C.white}">${fmt(p.px)}</dd></div>
     <div><dt>P&amp;L</dt><dd class="${cls(m.pnl)}">${rup(m.pnl)}</dd></div>
     <div><dt>STOP · SL-M</dt><dd style="color:${C.red}">${fmt(p.stop)}</dd></div>
     <div><dt>TARGET</dt><dd style="color:${C.magenta}">${fmt(p.target)}</dd></div>
     <div><dt>ATR · DAILY</dt><dd>${fmt(p.atr)}</dd></div>
     <div><dt>${p.tier===1?'HARD EXIT':'OPENED'}</dt><dd>${p.tier===1?p.hardExit:p.opened}</dd></div>
   </dl>`;
}
function renderPFD(p){
  const svg=$('pfd');
  if(!p){svg.innerHTML='';$('legend').innerHTML='';$('gauges').innerHTML='';return}
  const W=860,T=16,B=372,CX=660,TX=680,NOWX=540,FC=20,d=p.dir;
  const ser=p.series, fEnd=p.px+p.vel*FC/6;
  const vals=[p.stop,p.target,p.entry,p.px,fEnd,...ser];
  const lo=Math.min(...vals)-0.18*p.atr, hi=Math.max(...vals)+0.18*p.atr;
  const y=v=>B-(v-lo)/(hi-lo)*(B-T);
  let s=`<rect x="0" y="0" width="${CX}" height="400" fill="${C.screen}"/><rect x="${TX}" y="0" width="${W-TX}" height="400" fill="#0C141B"/>`;
  // bands measured in ATR from the stop
  const bands=p.tier===1
    ?[[0,T1_PROX,C.red,.17,'PROX'],[T1_PROX,T1_WATCH,C.amber,.08,'WATCH']]
    :[[0,TCAS.ALIM,C.red,.2,'ALIM'],[TCAS.ALIM,TCAS.RA,C.red,.09,'RA'],[TCAS.RA,TCAS.TA,C.amber,.08,'TA']];
  for(const [a0,a1,col,op] of bands){
    const y1=y(p.stop+d*a0*p.atr), y2=y(p.stop+d*a1*p.atr), top=Math.max(T,Math.min(y1,y2)), h=Math.min(B,Math.max(y1,y2))-top;
    if(h<=0) continue;
    s+=`<rect x="0" y="${top}" width="${CX}" height="${h}" fill="${col}" opacity="${op}"/><rect x="${TX}" y="${top}" width="20" height="${h}" fill="${col}" opacity="${Math.min(1,op*4)}"/>`;
  }
  // scale
  const stp=niceStep((hi-lo)/7), dec=stp<1?2:stp<10?1:0;
  for(let v=Math.ceil(lo/stp)*stp; v<=hi; v+=stp){
    const yy=y(v).toFixed(1);
    s+=`<line x1="0" x2="${CX}" y1="${yy}" y2="${yy}" stroke="${C.line}" stroke-width="1"/>`;
    s+=`<line x1="${TX+20}" x2="${TX+30}" y1="${yy}" y2="${yy}" stroke="${C.dim}" stroke-width="1"/><text x="${TX+36}" y="${+yy+4}" fill="${C.dim}" font-family="B612 Mono,monospace" font-size="11">${fmt(v,dec)}</text>`;
  }
  // levels
  const tags=[];
  const level=(v,col,dash,wid,label,op=1)=>{
    const yy=y(v).toFixed(1);
    s+=`<line x1="0" x2="${CX}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="${wid}" ${dash?`stroke-dasharray="${dash}"`:''} opacity="${op}"/>`;
    s+=`<line x1="${TX}" x2="${W}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="${wid}" ${dash?`stroke-dasharray="${dash}"`:''} opacity="${op}"/>`;
    tags.push({y:+yy,label,col});
  };
  level(p.stop,C.red,'',1.6,'STOP '+fmt(p.stop));
  level(p.entry,C.cyan,'6 4',1.2,'ENTRY '+fmt(p.entry));
  if(p.tier===2) ILS.forEach(([n,pc])=>level(p.entry+(p.target-p.entry)*pc/100,C.magenta,'2 4',1,n,.55));
  else level(p.entry*(1+d*0.01),C.green,'2 4',1,'TRAIL +1%',.6);
  level(p.target,C.magenta,'',1.6,'TGT '+fmt(p.target));
  // chart-side labels, de-collided
  tags.sort((a,b)=>a.y-b.y); let last=-99;
  for(const t of tags){const yy=Math.max(t.y-4,last+12); last=yy; s+=`<text x="${CX-6}" y="${yy}" text-anchor="end" fill="${t.col}" font-family="B612 Mono,monospace" font-size="10.5" font-weight="700">${t.label}</text>`}
  // price trace
  const N=ser.length, xs=i=>i/(N-1)*NOWX;
  const path=ser.map((v,i)=>`${i?'L':'M'}${xs(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  s+=`<path d="${path} L${NOWX} ${B} L0 ${B} Z" fill="${C.ink}" opacity=".05"/>`;
  s+=`<path d="${path}" fill="none" stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round"/>`;
  // Kalman forecast cone
  let up='',dn='',mid='';
  for(let k=0;k<=FC;k++){const x=NOWX+k*(CX-20-NOWX)/FC, c=p.px+p.vel*k/6, w=0.035*p.atr*Math.sqrt(k);
    up+=`${k?'L':'M'}${x.toFixed(1)} ${y(c+w).toFixed(1)} `; dn=`L${x.toFixed(1)} ${y(c-w).toFixed(1)} `+dn; mid+=`${k?'L':'M'}${x.toFixed(1)} ${y(c).toFixed(1)} `}
  s+=`<path d="${up}${dn}Z" fill="${C.cyan}" opacity=".14"/><path d="${mid}" fill="none" stroke="${C.cyan}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
  s+=`<line x1="${NOWX}" x2="${NOWX}" y1="${T}" y2="${B}" stroke="${C.faint}" stroke-dasharray="2 3"/>`;
  s+=`<text x="${NOWX}" y="392" text-anchor="middle" fill="${C.dim}" font-family="B612 Mono,monospace" font-size="10">NOW</text>`;
  s+=`<text x="${CX-20}" y="392" text-anchor="end" fill="${C.cyan}" font-family="B612 Mono,monospace" font-size="10">KALMAN PROJECTION</text>`;
  s+=`<text x="4" y="392" fill="${C.dim}" font-family="B612 Mono,monospace" font-size="10">SESSION TRACE</text>`;
  s+=`<circle cx="${NOWX}" cy="${y(p.px).toFixed(1)}" r="3.5" fill="${C.white}"/>`;
  // tape: trend vector + price box
  const yb=y(p.px), yv=y(p.px+p.vel*10), fav=p.vel*d>=0, vc=fav?C.green:C.amber;
  if(Math.abs(yv-yb)>3){const dirp=yv<yb?-1:1;
    s+=`<line x1="${TX+10}" x2="${TX+10}" y1="${yb}" y2="${yv}" stroke="${vc}" stroke-width="3"/><path d="M${TX+4} ${yv-dirp*1} L${TX+16} ${yv-dirp*1} L${TX+10} ${yv+dirp*8} Z" fill="${vc}"/>`;}
  s+=`<path d="M${TX+24} ${yb} L${TX+34} ${yb-13} L${W-6} ${yb-13} L${W-6} ${yb+13} L${TX+34} ${yb+13} Z" fill="#000" stroke="${C.white}" stroke-width="1.5"/>`;
  s+=`<text x="${TX+42}" y="${yb+5.5}" fill="${C.white}" font-family="B612 Mono,monospace" font-size="16" font-weight="700">${fmt(p.px)}</text>`;
  svg.innerHTML=s;

  $('legend').innerHTML=(p.tier===1
    ?`<span><i style="background:${C.red}"></i>Proximity exit &lt; 0.5 ATR + adverse velocity</span><span><i style="background:${C.amber}"></i>Watch &lt; 0.75 ATR</span><span><i style="background:${C.green}"></i>TCAS trail arms at +1%</span>`
    :`<span><i style="background:${C.red}"></i>ALIM &lt; 0.75 ATR · RA &lt; 1.5 ATR</span><span><i style="background:${C.amber}"></i>TA &lt; 2.0 ATR</span><span><i style="background:${C.magenta}"></i>ILS OM 25 · MM 50 · IM 75 · DH 90 %</span>`)
    +`<span><i style="background:${C.cyan}"></i>Kalman 20-tick projection · cone = uncertainty</span><span>Vector on tape = 10-min velocity</span>`;
  renderGauges(p);
}
function arc(cx,cy,r,f1,f2){
  const a1=(210-240*f1)*Math.PI/180, a2=(210-240*f2)*Math.PI/180;
  return `M${(cx+r*Math.cos(a1)).toFixed(1)} ${(cy-r*Math.sin(a1)).toFixed(1)} A${r} ${r} 0 ${240*(f2-f1)>180?1:0} 1 ${(cx+r*Math.cos(a2)).toFixed(1)} ${(cy-r*Math.sin(a2)).toFixed(1)}`;
}
function gauge(o){
  const cx=85,cy=66,r=52, cl=v=>Math.max(0,Math.min(1,(v-o.min)/(o.max-o.min)));
  let s=`<svg viewBox="0 0 170 112" role="img" aria-label="${o.label}: ${o.text}"><path d="${arc(cx,cy,r,0,1)}" stroke="${C.line2}" stroke-width="7" fill="none"/>`;
  for(const [a,b,col] of o.bands) s+=`<path d="${arc(cx,cy,r,cl(a),cl(b))}" stroke="${col}" stroke-width="7" fill="none" opacity=".9"/>`;
  for(const [v,lab] of (o.marks||[])){const a=(210-240*cl(v))*Math.PI/180;
    s+=`<line x1="${cx+(r-10)*Math.cos(a)}" y1="${cy-(r-10)*Math.sin(a)}" x2="${cx+(r+5)*Math.cos(a)}" y2="${cy-(r+5)*Math.sin(a)}" stroke="${C.magenta}" stroke-width="1.5"/>`;
    if(lab) s+=`<text x="${cx+(r+13)*Math.cos(a)}" y="${cy-(r+13)*Math.sin(a)+3}" text-anchor="middle" fill="${C.magenta}" font-family="B612 Mono,monospace" font-size="8">${lab}</text>`;}
  const a=(210-240*cl(o.value))*Math.PI/180;
  s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+(r-6)*Math.cos(a)).toFixed(1)}" y2="${(cy-(r-6)*Math.sin(a)).toFixed(1)}" stroke="${C.white}" stroke-width="2.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="${C.white}"/>`;
  s+=`<text x="${cx}" y="${cy+32}" text-anchor="middle" fill="${o.color}" font-family="B612 Mono,monospace" font-size="17" font-weight="700">${o.text}</text></svg>`;
  return `<div class="g"><span class="gl">${o.label}</span>${s}<span class="gs">${o.sub}</span></div>`;
}
function renderGauges(p){
  const m=metrics(p), st=state(p);
  const distBands=p.tier===1?[[0,T1_PROX,C.red],[T1_PROX,T1_WATCH,C.amber],[T1_WATCH,3,C.green]]:[[0,TCAS.ALIM,C.red],[TCAS.ALIM,TCAS.RA,'#C9443F'],[TCAS.RA,TCAS.TA,C.amber],[TCAS.TA,4,C.green]];
  const tau=m.fav<0?Math.abs((p.px-p.stop)/p.vel):null;
  $('gauges').innerHTML=[
    gauge({label:'P&L',value:m.pct,min:-2,max:2,bands:[[-2,-1,C.red],[-1,0,C.amber],[0,2,C.green]],text:sgn(m.pct)+'%',color:m.pct>=0?C.green:C.red,sub:rup(m.pnl)+' on '+p.qty+' qty'}),
    gauge({label:'TO STOP',value:m.dist,min:0,max:p.tier===1?3:4,bands:distBands,text:fmt(m.dist)+' ATR',color:st.c==='ok'?C.green:st.c==='ta'?C.amber:C.red,sub:tau?`τ ≈ ${Math.round(tau)} min at current velocity`:'not closing on stop'}),
    gauge({label:'ILS PROGRESS',value:m.ils,min:0,max:100,bands:[[0,Math.max(0,Math.min(100,m.ils)),C.green]],marks:ILS.map(([n,v])=>[v,n]),text:Math.round(m.ils)+'%',color:C.magenta,sub:'entry → target '+fmt(p.target)}),
    gauge({label:'KALMAN VELOCITY',value:m.fav,min:-2,max:2,bands:[[-2,0,C.amber],[0,2,C.green]],text:sgn(p.vel)+' ₹/min',color:m.fav>=0?C.green:C.amber,sub:m.fav>=0?'moving with the trade':'moving against the trade'}),
  ].join('');
}
function renderTable(){
  const tb=$('posBody');
  if(!positions.length){tb.innerHTML='<tr><td colspan="13" class="empty">No open positions.</td></tr>';return}
  tb.innerHTML=positions.map(p=>{const m=metrics(p), s=state(p);
    return `<tr data-sym="${p.sym}" tabindex="0" class="${p.sym===selected?'sel':''}" aria-selected="${p.sym===selected}">
      <td class="symc">${p.sym}</td><td><span class="pill info">${p.src}</span></td><td class="${p.dir>0?'ok':'ra'}">${p.side}</td><td class="dim">${p.prod} · T${p.tier}</td>
      <td class="r num">${p.qty}</td><td class="r num">${fmt(p.entry)}</td><td class="r num" style="color:${C.white}">${fmt(p.px)}</td>
      <td class="r num ${cls(m.pnl)}">${rup(m.pnl)}</td><td class="r num ${cls(m.pct)}">${sgn(m.pct)}%</td><td class="r num">${fmt(p.stop)}</td>
      <td class="r num ${s.c}">${fmt(m.dist)} ATR</td><td><span class="pill ${s.c}">${s.label}</span></td><td class="num dim">${p.opened}</td></tr>`}).join('');
}
function renderLog(){
  let sum=0;
  $('logBody').innerHTML=closed.map(c=>{const pnl=(c.exit-c.entry)*(c.side==='LONG'?1:-1)*c.qty; sum+=pnl;
    return `<tr><td class="num dim">${c.t}</td><td class="symc">${c.sym}</td><td><span class="pill info">${c.src}</span></td><td class="r num">${c.qty}</td><td class="r num">${fmt(c.entry)}</td><td class="r num">${fmt(c.exit)}</td><td class="r num ${cls(pnl)}">${rup(pnl)}</td><td><span class="pill ${c.reason==='TARGET_HIT'?'ok':'ra'}">${c.reason}</span></td></tr>`}).join('');
  const w=closed.filter(c=>(c.exit-c.entry)*(c.side==='LONG'?1:-1)>0).length;
  $('logSum').innerHTML=`<b class="${cls(sum)}">${rup(sum)}</b> · ${w}/${closed.length} landed`;
}
let msgSig='';
function renderMsgs(){
  const sig=msgs.map(m=>m.id+(m.acked?'a':'')).join(',');
  if(sig===msgSig) return; msgSig=sig;
  const open=msgs.filter(m=>!m.acked).length;
  $('msgCount').textContent=open?`${open} to acknowledge`:'all acknowledged';
  $('msgs').innerHTML=msgs.map(m=>{const c=m.sev==='RA'?'ra':m.sev==='TA'?'ta':'info';
    return `<li class="${m.acked&&m.sev!=='INFO'?'acked':''}"><span class="t">${m.t}</span>
      <span class="h"><span class="pill ${m.sev==='INFO'?c:'fill '+c}">${m.sev}</span><span class="src">${m.src}</span>${!m.acked?`<button class="ack" data-ack="${m.id}">ACK</button>`:''}</span>
      <span class="x">${m.text}</span></li>`}).join('');
}
function renderStatus(){
  $('status').innerHTML=`<span>KITE <b>connected</b></span><span>PH4 loop <b>TIER1 fast · TIER2 TCAS/ILS</b></span><span>Last tick <b>${clock(sec)}</b></span><span>Loss limit <b>${rup(LOSS_LIMIT,0)}</b></span><span>Tick size <b>₹0.10 orders</b></span><span class="demo">DEMO FEED — example positions and a simulated price feed, not live account data</span>`;
}
function render(){
  const p=positions.find(x=>x.sym===selected);
  renderTop(); renderPipe(); renderHead(p); renderPFD(p); renderTable(); renderLog(); renderMsgs(); renderStatus();
}

/* ---------- interaction ---------- */
$('posBody').addEventListener('click',e=>{const tr=e.target.closest('tr[data-sym]'); if(tr){selected=tr.dataset.sym; render()}});
$('posBody').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const tr=e.target.closest('tr[data-sym]'); if(tr){e.preventDefault(); selected=tr.dataset.sym; render(); const n=document.querySelector(`#posBody tr[data-sym="${selected}"]`); n&&n.focus()}}});
$('msgs').addEventListener('click',e=>{const b=e.target.closest('[data-ack]'); if(b){const m=msgs.find(x=>x.id===+b.dataset.ack); if(m){m.acked=true; render()}}});
$('top').addEventListener('click',e=>{const b=e.target.closest('[data-master]'); if(b){msgs.forEach(m=>{if(m.sev===b.dataset.master) m.acked=true}); render()}});

renderSystems(); render();
setInterval(step,1000);
})();
</script>
